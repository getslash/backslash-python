[build-system]
requires = ["hatchling>=0.25.1", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "backslash"
description = "Client library for the Backslash test reporting service"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD 3-Clause License" }

classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "GitPython",
    "Logbook",
    "munch",
    "requests",
    "sentinels",
    "URLObject",
    "vintage",
]

dynamic = ["version"]

authors = [{ name = "Rotem Yaari", email = "vmalloc@gmail.com" }]

[project.urls]
"Homepage" = "http://getslash.github.io/"
"GitHub" = "https://github.com/getslash/backslash"

[project.optional-dependencies]
testing = [
    "slash>=1.5.0",
    "Flask",
    "Flask-Loopback",
    "pylint",
    "pytest>4.0",
    "pytest-cov>=2.6",
    "URLObject",
    "weber-utils",
    # Slash still using pkg_resources, installing setuptools as temporary workaround
    # so this repo can be installed with UV
    # Should be removed once a new version of slash will be released.
    "setuptools<81",
]
doc = ["alabaster", "releases", "Sphinx"]

[tool.hatch.version]
source = "vcs"

[tool.pytest]
testpaths = "tests"
timeout_method = "signal"
# Current slash version uses pkg_resources, deprecated module, which emits warnings.
# This option (of consider warnings as errors) should be comment out, until a new slash version will be released.
# addopts = "-ra -W error::DeprecationWarning"
